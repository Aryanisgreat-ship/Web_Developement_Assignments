
<!DOCTYPE html>
<html>
<head>
    <title>Online Course Enrollment</title>
</head>
<body>

<h1>TechLearn Academy</h1>
<h2>Online Course Enrollment & Student Registration</h2>

<img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800"
     alt="Students learning programming online" width="600">

<p>
Register for technical courses and develop practical skills in programming,
web development and computer science.
</p>

<p>
<a href="https://www.coursera.org/" target="_blank">
Course Information
</a>
</p>

<hr>

<form action="#" method="post">

<h3>Account Information</h3>

<label for="name">Student Name:</label>
<input type="text" id="name" name="student_name"
       minlength="3" maxlength="50" required>
<br><br>

<label for="email">Email:</label>
<input type="email" id="email" name="email"
       autocomplete="email" required>
<br><br>

<label for="password">Password:</label>
<input type="password" id="password" name="password"
       minlength="8" maxlength="20" required>
<br><br>

<label for="mobile">Mobile:</label>
<input type="tel" id="mobile" name="mobile"
       pattern="[0-9]{10}" required>
<br><br>

<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob" required>

<hr>

<h3>Course Selection</h3>

<label for="course">Select Course:</label>
<select id="course" name="course" required>
    <option value="">Select Course</option>
    <option value="python">Python Programming</option>
    <option value="java">Java Programming</option>
    <option value="web">Web Development</option>
    <option value="dsa">Data Structures</option>
    <option value="database">Database Management</option>
    <option value="aiml">AI & Machine Learning</option>
</select>

<br><br>

<label for="batch">Select Batch:</label>
<select id="batch" name="batch" required>
    <option value="">Select Batch</option>
    <option value="morning">Morning - 9 AM</option>
    <option value="afternoon">Afternoon - 2 PM</option>
    <option value="evening">Evening - 6 PM</option>
</select>

<br><br>

<label>Learning Preference:</label><br>

<input type="radio" id="online" name="learning_mode"
       value="Online" required>
<label for="online">Online</label>

<input type="radio" id="offline" name="learning_mode"
       value="Offline">
<label for="offline">Offline</label>

<input type="radio" id="hybrid" name="learning_mode"
       value="Hybrid">
<label for="hybrid">Hybrid</label>

<br><br>

<label>Areas of Interest:</label><br>

<input type="checkbox" id="java" name="interest" value="Java">
<label for="java">Java</label>

<input type="checkbox" id="python" name="interest" value="Python">
<label for="python">Python</label>

<input type="checkbox" id="web" name="interest" value="Web Development">
<label for="web">Web Development</label>

<input type="checkbox" id="dsa" name="interest" value="Data Structures">
<label for="dsa">Data Structures</label>

<input type="checkbox" id="db" name="interest" value="Database">
<label for="db">Database</label>

<hr>

<h3>Educational Background</h3>

<label for="education">Education Level:</label>
<select id="education" name="education" required>
    <option value="">Select</option>
    <option value="12th">Class 12</option>
    <option value="diploma">Diploma</option>
    <option value="graduate">Graduate</option>
    <option value="postgraduate">Post Graduate</option>
</select>

<br><br>

<label for="college">College / Institution:</label>
<input type="text" id="college" name="institution"
       maxlength="100" required>
<br><br>

<label for="semester">Current Semester / Year:</label>
<input type="text" id="semester" name="semester"
       placeholder="Example: 1st Semester" required>
<br><br>

<label for="experience">Programming Experience (Years):</label>
<input type="number" id="experience" name="experience"
       min="0" max="10" step="0.5" value="0">

<br><br>

<label for="github">GitHub / Portfolio URL:</label>
<input type="url" id="github" name="portfolio"
       placeholder="https://github.com/username">

<br><br>

<label for="goals">Learning Goals:</label><br>
<textarea id="goals" name="learning_goals"
          rows="5" cols="50"
          minlength="10" maxlength="500"
          placeholder="Tell us about your learning goals"
          required></textarea>

<br><br>

<input type="checkbox" id="confirm" name="confirmation"
       value="confirmed" required>
<label for="confirm">
    I confirm that the information provided is correct.
</label>

<br><br>

<input type="submit" value="Enroll Now">
<input type="reset" value="Reset">

</form>

</body>
</html>
