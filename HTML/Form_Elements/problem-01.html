
<!DOCTYPE html>
<html>
<head>
    <title>College Admission Application</title>
</head>
<body>

<h1>GLA University Greater Noida</h1>
<h2>College Admission Application Form</h2>

<img src="https://images.unsplash.com/photo-1562774053-701939374585?w=800"
     alt="University campus" width="600">

<p>
Welcome to the college admission application portal. Please fill in all
required information carefully before submitting the form.
</p>

<hr>

<form action="#" method="post">

<h3>Personal Information</h3>

<label for="name">Full Name:</label>
<input type="text" id="name" name="full_name"
       placeholder="Enter your full name"
       minlength="3" maxlength="50" required>
<br><br>

<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="date_of_birth"
       min="2000-01-01" max="2010-12-31" required>
<br><br>

<label for="email">Email:</label>
<input type="email" id="email" name="email"
       placeholder="student@example.com" required>
<br><br>

<label for="mobile">Mobile Number:</label>
<input type="tel" id="mobile" name="mobile"
       placeholder="10 digit mobile number"
       pattern="[0-9]{10}" required>
<br><br>

<label for="pin">Application PIN:</label>
<input type="password" id="pin" name="application_pin"
       minlength="6" maxlength="12" required>
<br><br>

<label>Gender:</label>
<input type="radio" id="male" name="gender" value="Male" required>
<label for="male">Male</label>

<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label>

<input type="radio" id="other" name="gender" value="Other">
<label for="other">Other</label>

<br><br>

<label for="category">Category:</label>
<select id="category" name="category" required>
    <option value="">Select Category</option>
    <option value="General">General</option>
    <option value="OBC">OBC</option>
    <option value="SC">SC</option>
    <option value="ST">ST</option>
</select>

<br><br>

<label for="address">Permanent Address:</label><br>
<textarea id="address" name="address"
          rows="4" cols="50"
          minlength="10" maxlength="200"
          placeholder="Enter your permanent address"
          required></textarea>

<hr>

<h3>Course Information</h3>

<label for="course">Select Program:</label>
<select id="course" name="program" required>
    <option value="">Choose a program</option>
    <option value="BTech-CSE">B.Tech CSE</option>
    <option value="BTech-AIML">B.Tech AI & ML</option>
    <option value="BCA">BCA</option>
    <option value="BBA">BBA</option>
    <option value="BSc-CS">B.Sc Computer Science</option>
    <option value="MCA">MCA</option>
</select>

<br><br>

<label for="qualification">Previous Qualification:</label>
<select id="qualification" name="qualification" required>
    <option value="">Select</option>
    <option value="12th">Class 12</option>
    <option value="Diploma">Diploma</option>
    <option value="Graduation">Graduation</option>
</select>

<br><br>

<label for="percentage">Percentage / CGPA:</label>
<input type="number" id="percentage" name="percentage"
       min="0" max="100" step="0.01" required>

<br><br>

<label for="year">Passing Year:</label>
<input type="number" id="year" name="passing_year"
       min="2015" max="2026" required>

<br><br>

<label for="school">School / College Name:</label>
<input type="text" id="school" name="school_name"
       maxlength="100" required>

<br><br>

<label>Interested Areas:</label><br>
<input type="checkbox" id="coding" name="interest" value="Coding">
<label for="coding">Coding</label>

<input type="checkbox" id="sports" name="interest" value="Sports">
<label for="sports">Sports</label>

<input type="checkbox" id="research" name="interest" value="Research">
<label for="research">Research</label>

<br><br>

<label for="document">Upload Admission Document:</label>
<input type="file" id="document" name="admission_document">

<br><br>

<input type="checkbox" id="declaration" name="declaration"
       value="accepted" required>
<label for="declaration">
    I confirm that the information provided by me is correct.
</label>

<br><br>

<input type="submit" value="Submit Application">
<input type="reset" value="Reset Form">

</form>

<hr>

<p>
<a href="https://www.gla.ac.in/" target="_blank">
Official University Website
</a>
</p>

</body>
</html>
